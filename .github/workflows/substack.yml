name: refresh substack posts

on:
  schedule:
    - cron: "17 6 * * *"      # daily; offset from the hour to avoid the rush
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/substack.yml"
      - ".github/scripts/fetch_substack.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the latest posts
        run: python3 .github/scripts/fetch_substack.py

      - name: Commit if the feed changed
        run: |
          if [ -n "$(git status --porcelain posts.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "Refresh Substack posts"
            git push
          else
            echo "Feed unchanged; nothing to commit."
          fi
